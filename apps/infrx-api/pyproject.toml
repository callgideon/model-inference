[project]
name = "infrx-api"
version = "0.1.0"
description = "InferenceX pilot API: gateway, durable state and shared contracts"
requires-python = "==3.12.*"
# Core = what the request path imports. Everything a single track needs lives in
# an extra, so a gateway process never imports psycopg, valkey, boto3 or anthropic.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
state = ["psycopg[binary,pool]>=3.2,<4"]
scheduling = ["valkey>=6,<7"]
traces = ["clickhouse-connect>=0.8,<1", "boto3>=1.35,<2"]
judge = ["anthropic>=0.40,<1"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[tool.uv]
# infrx/ is used from the source tree (pythonpath below), the
# deployment unit is the checkout itself; there is nothing to build or install.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib import mode: tests/<track>/ directories may hold same-named files
# (tests/d/test_admit.py and tests/g/test_admit.py) without a basename collision.
addopts = "--import-mode=importlib"
markers = ["pg: runs on the lane's task-local PostgreSQL"]

# A14 (W6): `make api-lint` = `uvx ruff@0.15.12 check` from this directory. ruff's
# default rules (E4, E7, E9, F) plus pyupgrade on the pinned Python.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["UP"]

[tool.ruff.lint.per-file-ignores]
# The frozen contracts (wave rule 1) are never modernised in place.
"infrx/contracts/**" = ["UP"]
# Baseline 2026-10-01 (W6 api-L5): findings in files other lanes own. Most are
# `ruff check --fix --select UP` mechanical fixes; delete a file's line when it is clean.
"deploy/replay_usage.py" = ["E401", "E741"]
"infrx/content/__init__.py" = ["UP017", "UP035"]
