# E2 task-local integration services (research/plan/04-verification.md layer 2).
#
# EVERY image is pinned by digest, never by tag alone: a tag is a moving target and a
# "pinned version" that moves is not evidence. The tag beside each digest is the tag the
# digest was resolved from (recorded in this task's evidence with the resolving command),
# and is a comment only - Docker uses the digest.
#
# Names, ports and lifetime (research/plan/08-contracts-v1-encoding.md §8, R48):
#   - project `infrx-e2`, every container `infrx-e2-<service>`;
#   - host ports only in 55500-55599 (E's range), bound to 127.0.0.1 so nothing is exposed;
#   - E3B phase 2: the project name and every host port come from `harness.compose_env()`
#     (`INFRX_E2_NAMESPACE` moves them as one block; unset they are exactly the above), and
#     `:?` refuses to run without them, so no port of another namespace can be defaulted;
#   - volumes are project-scoped and disposable (`down -v` removes them);
#   - credentials are fixed local test strings. No production credential is ever needed,
#     and nothing here may be pointed at Supabase production or AWS.
#
# r1 review B1 — OWNERSHIP IS A LABEL, NOT THE PROJECT NAME. Two checkouts of this
# repository use the same project name, and a hand-made volume can simply be given the name
# compose would pick; keying teardown on the name alone destroyed another run's live stack
# and deleted a same-named volume it had not created. Every container, every volume and the
# network therefore carries `ai.infrx.e2.checkout`, set from `INFRX_E2_CHECKOUT`, which
# `harness.py` always exports as this compose file's directory. `:?` makes compose REFUSE to
# run without it, so the label can never be silently absent, and anything carrying one of
# these names WITHOUT the matching label is foreign: reported, never touched. Compose labels
# volumes with the project but not with `project.working_dir`, which is why this label is
# ours rather than one of compose's.
#
# There is no healthcheck block on purpose: readiness is polled from the host in
# `harness.py`, one mechanism for four images instead of four guesses about which client
# binary each image happens to ship.
name: ${INFRX_E2_PROJECT:?exported by tests/integration/harness.py}

x-checkout: &checkout
  ai.infrx.e2.checkout: ${INFRX_E2_CHECKOUT:?exported by tests/integration/harness.py}

services:
  # Supabase-compatible PostgreSQL. apps/app/supabase/migrations/0001_init.sql references
  # `auth.users`, `auth.uid()` and the `anon`/`authenticated`/`service_role` roles, which
  # plain postgres does not have; this image's entrypoint creates all of them in the
  # `postgres` database, and `harness.provision_database()` copies that database into
  # `infrx_e2` with CREATE DATABASE … TEMPLATE … OWNER postgres (r1 review R-a), so the
  # target database matches D1's `current_database() like 'infrx\_%'` clock gate.
  postgres:
    image: supabase/postgres@sha256:7768d0d1d377250b718a9ad07f4661d008ebe6c96ecbbc4c08f3c5e53553e8fd  # 17.6.1.173
    container_name: ${INFRX_E2_PROJECT:?}-postgres
    labels: *checkout
    environment:
      POSTGRES_PASSWORD: infrx-e2-local
    ports:
      - "127.0.0.1:${INFRX_E2_PORT_POSTGRES:?}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    stop_grace_period: 5s

  valkey:
    image: valkey/valkey@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1  # 8.1-alpine
    container_name: ${INFRX_E2_PROJECT:?}-valkey
    labels: *checkout
    # Disposable by construction: no RDB snapshot, no AOF. A restart is an empty index,
    # which is what DUR-OUTBOX's "lose Valkey data" injection wants to be cheap.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${INFRX_E2_PORT_VALKEY:?}:6379"
    stop_grace_period: 5s

  clickhouse:
    image: clickhouse/clickhouse-server@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146  # 25.8.33.6-alpine
    container_name: ${INFRX_E2_PROJECT:?}-clickhouse
    labels: *checkout
    environment:
      CLICKHOUSE_DB: infrx_e2
      CLICKHOUSE_USER: infrx_e2
      CLICKHOUSE_PASSWORD: infrx-e2-local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${INFRX_E2_PORT_CLICKHOUSE_HTTP:?}:8123"
      - "127.0.0.1:${INFRX_E2_PORT_CLICKHOUSE_NATIVE:?}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    stop_grace_period: 5s

  s3:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e  # RELEASE.2025-09-07T16-13-09Z
    container_name: ${INFRX_E2_PROJECT:?}-s3
    labels: *checkout
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: infrxe2minio
      MINIO_ROOT_PASSWORD: infrx-e2-local-secret
    ports:
      - "127.0.0.1:${INFRX_E2_PORT_S3:?}:9000"
    volumes:
      - s3-data:/data
    stop_grace_period: 5s

volumes:
  postgres-data:
    labels: *checkout
  clickhouse-data:
    labels: *checkout
  s3-data:
    labels: *checkout

networks:
  default:
    labels: *checkout
